name: chatsito-docker

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DOCKER_DB_USER}
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD}
      POSTGRES_DB: ${DOCKER_DB_NAME}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build: .
    image: j4mm32/chatsito-backend:local-v1
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DOCKER_DB_USER}:${DOCKER_DB_PASSWORD}@postgres:5432/${DOCKER_DB_NAME}?schema=public
      JWT_SECRET: ${DOCKER_JWT_SECRET}
      JWT_EXPIRES_IN: 1d
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build: ../frontend-chatsito
    image: j4mm32/chatsito-frontend:local-v1
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  uploads: